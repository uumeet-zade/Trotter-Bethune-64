<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Anton&amp;display=swap');
    </style>
  </defs>
  <!-- Background -->
  <rect width="1000" height="1000" fill="#e8e8e8" />
  
  <!-- Top Left Triangle -->
  <polygon points="0,0 850,0 0,220" fill="#BF2519" />
  
  <!-- Bottom Left Pink Triangle -->
  <polygon points="0,1000 0,730 650,1000" fill="#D7003A" />
  
  <!-- Bottom Right Triangle -->
  <polygon points="1000,1000 800,1000 1000,220" fill="#44012D" />
  
  <!-- Text Overlays -->
  <g font-family="Anton, Impact, Arial, sans-serif" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
    <!-- Top Left Text -->
    <text transform="translate(300, 80) rotate(-10)" font-size="55">MANDY TROTTIER</text>
    <!-- Bottom Left Text -->
    <text transform="translate(250, 920) rotate(18)" font-size="50">FLORENCE MARIN</text>
    <!-- Bottom Right Text -->
    <text transform="translate(930, 700) rotate(-75)" font-size="40">SAFIYA FAYYAD-BETHUNE</text>
  </g>
  
  <!-- Main Title Text -->
  <g font-family="Anton, Impact, Arial, sans-serif" font-weight="bold" fill="#222222" text-anchor="middle">
    <text x="550" y="780" font-size="70" letter-spacing="2">WHERE WERE WE</text>
    <text x="550" y="860" font-size="70" letter-spacing="2">LEFT?</text>
  </g>
</svg>
