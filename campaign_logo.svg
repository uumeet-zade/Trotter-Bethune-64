<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 400" width="100%" height="100%" aria-label="Trottier Bethune '64 Logo">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Anton&amp;family=Space+Mono:ital,wght@0,400;0,700;1,400&amp;display=swap');
        </style>
    </defs>

    <!-- Massive red block on the left -->
    <rect x="0" y="0" width="350" height="400" fill="#C8102E" />
    
    <!-- White/Black background block for the subtitle to create stark contrast -->
    <rect x="350" y="200" width="1050" height="200" fill="#e0e0e0" />

    <!-- 64 inside the red block -->
    <text x="175" y="280" font-family="'Space Mono', monospace" font-size="220" font-weight="bold" letter-spacing="-12" fill="#0a0a0a" text-anchor="middle">64</text>

    <!-- TROTTIER in the top half -->
    <text x="380" y="190" font-family="'Anton', sans-serif" font-size="210" text-transform="uppercase" letter-spacing="-2" fill="#e0e0e0" text-anchor="start">TROTTIER</text>

    <!-- BETHUNE in the bottom half -->
    <text x="380" y="390" font-family="'Anton', sans-serif" font-size="210" text-transform="uppercase" letter-spacing="-2" fill="#0a0a0a" text-anchor="start">BETHUNE</text>

    <!-- Vertical harsh separator line -->
    <rect x="350" y="0" width="16" height="400" fill="#e0e0e0" />
</svg>
