<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%" class="campaign-wordmark" aria-label="Trottier Bethune '64 Logo">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Anton&amp;family=Space+Mono:ital,wght@0,400;0,700;1,400&amp;display=swap');
            
            /* Fallback variables so the SVG renders when viewed by itself */
            :root {
                --text-light: #e0e0e0;
                --obsidian: #0a0a0a;
                --crimson: #C8102E;
            }

            .brutal-title { font-family: 'Anton', sans-serif; font-size: 210px; text-transform: uppercase; letter-spacing: -2px; fill: var(--text-light); }
            .brutal-subtitle { font-family: 'Anton', sans-serif; font-size: 210px; text-transform: uppercase; letter-spacing: -2px; fill: var(--obsidian); }
            .brutal-year { font-family: 'Space Mono', monospace; font-size: 220px; font-weight: bold; letter-spacing: -12px; fill: var(--obsidian); }
            .logo-crimson { fill: var(--crimson); }
            .logo-bg { fill: var(--text-light); }
        </style>
    </defs>

    <!-- Massive red block on the left -->
    <rect x="0" y="0" width="350" height="400" class="logo-crimson" />
    
    <!-- White/Black background block for the subtitle to create stark contrast -->
    <rect x="350" y="200" width="850" height="200" class="logo-bg" />

    <!-- 64 inside the red block -->
    <text x="175" y="280" class="brutal-year" text-anchor="middle">64</text>

    <!-- TROTTIER in the top half -->
    <text x="380" y="190" class="brutal-title" text-anchor="start">TROTTIER</text>

    <!-- BETHUNE in the bottom half -->
    <text x="380" y="390" class="brutal-subtitle" text-anchor="start">BETHUNE</text>

    <!-- Vertical harsh separator line -->
    <rect x="350" y="0" width="16" height="400" fill="var(--text-light)" />
</svg>
