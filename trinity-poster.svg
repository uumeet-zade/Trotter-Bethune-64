<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1080" width="100%" height="100%">
    <defs>
        <!-- Stark greyscale & high contrast filter for the portraits to match the propaganda style -->
        <filter id="brutal-portrait">
            <feColorMatrix type="matrix" values="
                0.33 0.33 0.33 0 0
                0.33 0.33 0.33 0 0
                0.33 0.33 0.33 0 0
                0    0    0    1 0"/>
            <feComponentTransfer>
                <feFuncR type="linear" slope="1.3" intercept="-0.15"/>
                <feFuncG type="linear" slope="1.3" intercept="-0.15"/>
                <feFuncB type="linear" slope="1.3" intercept="-0.15"/>
            </feComponentTransfer>
            <feDropShadow dx="15" dy="15" stdDeviation="15" flood-color="#000" flood-opacity="0.6"/>
        </filter>
        

    </defs>

    <!-- Base Background (Visible in the slanted gaps) -->
    <rect width="2400" height="1080" fill="#e8e8e8" />
    
    <!-- Slanted Red Banner Grid (Perfectly equal parallelograms, 750px wide, 75px gaps) -->
    <!-- Left Banner -->
    <polygon points="200,0 950,0 550,1080 -200,1080" fill="#C8102E" />
    
    <!-- Middle Banner -->
    <polygon points="1025,0 1775,0 1375,1080 625,1080" fill="#C8102E" />
    
    <!-- Right Banner -->
    <polygon points="1850,0 2600,0 2200,1080 1450,1080" fill="#C8102E" />

    <!-- Candidate 1: Left Position Placeholder -->
    <!-- Add your image here. Recommended x="-50" y="150" width="850" height="950" filter="url(#brutal-portrait)" -->

    <!-- Candidate 2: Center Position Placeholder -->
    <!-- Add your image here. Recommended x="625" y="50" width="1150" height="1080" filter="url(#brutal-portrait)" -->

    <!-- Candidate 3: Right Position Placeholder -->
    <!-- Add your image here. Recommended x="1625" y="200" width="800" height="900" filter="url(#brutal-portrait)" -->
    

</svg>
